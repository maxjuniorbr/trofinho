name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    name: Typecheck · Lint · Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # S6505/S8543: --ignore-scripts prevents post-install scripts from
      # executing untrusted code. Node version pinned via .nvmrc above.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm run lint

      # Single test run with coverage — avoids running the suite twice.
      # Coverage report is consumed by SonarCloud in the next step.
      - name: Test with coverage
        run: npm run test:coverage

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        with:
          args: -Dproject.settings=.sonarcloud.properties
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  schema-drift:
    name: Schema drift check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Skip when Supabase secrets are unavailable
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_REF == ''
        run: echo "Skipping schema drift check because Supabase secrets are not available in this PR context."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        with:
          node-version-file: .nvmrc
          cache: npm

      # S6505/S8543: --ignore-scripts prevents post-install scripts from
      # executing untrusted code. Node version pinned via .nvmrc above.
      - run: npm ci --ignore-scripts
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''

      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        with:
          version: 2.95.6

      - name: Regenerate types and check for drift
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_REF != ''
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          npm run db:types
          if ! git diff --exit-code src/types/database.types.ts; then
            echo "::error::database.types.ts is stale. Run 'npm run db:types' and commit the result."
            exit 1
          fi
