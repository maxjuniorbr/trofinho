<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trofinho — E-mail Confirmado</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #131720;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .container { text-align: center; max-width: 400px; width: 100%; }
    .logo { font-size: 32px; font-weight: 700; color: #FAC114; margin-bottom: 32px; letter-spacing: -0.5px; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    .message { font-size: 18px; line-height: 1.5; color: #ffffff; margin-bottom: 16px; }
    .submessage { font-size: 14px; line-height: 1.5; color: rgba(255, 255, 255, 0.6); }
    .error { color: #FAC114; font-size: 18px; line-height: 1.5; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(250, 193, 20, 0.2);
      border-top-color: #FAC114;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Trofinho</div>
    <div id="content"></div>
  </div>

  <script>
    (function() {
      var content = document.getElementById('content');

      // Supabase redirects with tokens in the URL fragment (#) after
      // verifying the signup token server-side. If the fragment contains
      // access_token and type=signup, the email was confirmed successfully.
      var raw = globalThis.location.hash.substring(1) || globalThis.location.search.substring(1);
      var params = new URLSearchParams(raw);

      var accessToken = params.get('access_token');
      var type = params.get('type');

      if (globalThis.history && globalThis.history.replaceState) {
        globalThis.history.replaceState(null, document.title, globalThis.location.pathname);
      }

      if (!accessToken || type !== 'signup') {
        content.innerHTML = '<p class="error">Link inválido ou expirado.</p>';
        return;
      }

      // Email was confirmed server-side by Supabase before redirecting here.
      var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isMobile) {
        content.innerHTML =
          '<div class="spinner"></div>' +
          '<p class="message">E-mail confirmado! Redirecionando…</p>' +
          '<p class="submessage">Se o app não abrir automaticamente, verifique se o Trofinho está instalado.</p>';

        globalThis.location.href = 'trofinho://email-confirmed';
      } else {
        content.innerHTML =
          '<div class="icon">✅</div>' +
          '<p class="message">E-mail confirmado com sucesso!</p>' +
          '<p class="submessage">Para a melhor experiência, recomendamos abrir links do Trofinho pelo celular.<br><br>' +
          'Volte ao app no seu celular para continuar.</p>';
      }
    })();
  </script>
</body>
</html>
